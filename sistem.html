async function upload(input,k){try{const [h,rows]=parseCSV(await input.files[0].text()),req=headers[k];if(req.length!==h.length||req.some(x=>!h.includes(x)))fail('Judul kolom harus sesuai templat.');let data=rows.map(r=>req.map(c=>r[h.indexOf(c)]));if(state.mode==='Simulasi'&&k!=='responses')fail('Mulai penelitian baru sebelum mengimpor data penelitian.');let next={...state};if(k==='responses'){let ids=new Set();next.responses=data.map(([id,...vals],i)=>{if(!id||ids.has(id)||vals.some(x=>!/^[1-5]$/.test(x)))fail('ID kosong/ganda atau jawaban di luar 1–5 pada baris '+(i+2));ids.add(id);return [id,...vals.map(Number)]});if(state.mode!=='Kosong'&&!(await confirmChange('Mengganti respons akan menghapus model, penilaian pakar, dan aksi lama. Lanjutkan?')))return;next={...empty(),responses:next.responses,mode:'Penelitian'}}else{if(!state.responses.length)fail('Impor respons terlebih dahulu.');if(k==='model'){const obj={};data.forEach(([id,path,...v])=>{let i=paths.indexOf(path);let n=v.map(x=>Number(x.replace(',','.')));if(i<0||id!=='H'+(i+1)||obj[i]||v.some(x=>!x)||n.some(x=>!Number.isFinite(x))||n[1]>n[2])fail('Periksa jalur, kode, estimasi, dan interval pada '+id);obj[i]=n});if(Object.keys(obj).length!==19)fail('Isi 19 jalur pada templat.');next.model=obj;next.actions={}}else if(k==='map'){let lookup=new Map(data);if(data.length!==214||lookup.size!==214)fail('Pemetaan memerlukan 214 kode unik.');next.map=items.map(([id])=>{let s=lookup.get(id);if(!s)fail('Indikator belum diisi untuk '+id);return mapKey(id.split('.')[0],s)});next.expert={};next.actions={}}else{let keys=new Set(state.map);if(!keys.size)fail('Impor pemetaan indikator terlebih dahulu.');let obj=Object.create(null);for(let [g,...v] of data){if(!keys.delete(g)||v.some(x=>!/^[1-5]$/.test(x)))fail('Periksa indikator dan skor CBUI 1–5 pada '+g);obj[g]=v.map(Number)}if(keys.size)fail('Skor pakar belum lengkap.');next.expert=obj;next.actions={}}}state=next;render();el('msg').textContent='Impor berhasil.'}catch(e) function method(){return '<section><h2>Rancangan sistem untuk tesis</h2><p><b>Judul penelitian</b><br>Pemodelan dan Optimasi Percepatan Masa Studi Berbasis Eksplorasi Variabel Human Capital, Leadership Style, dan Literasi Teknologi Menggunakan Metode POP-SDM-AI.</p><p><b>Artefak ilmu komputer</b><br>Aplikasi pendukung keputusan berbasis peramban yang mengubah respons mentah menjadi data analisis dan menghubungkan hasil model dengan prioritas tindakan program studi.</p>'+table(['Lapisan','Masukan dan proses','Keluaran'],[['Data','CSV dengan ID samaran dan jawaban 214 butir','Matriks tervalidasi'],['Pengolahan','Kamus butir dan kunci pembalikan dari laporan uji coba','Skor terkoreksi dan profil konstruk'],['Pemodelan eksternal','SmartPLS: evaluasi model pengukuran, koefisien jalur dan bootstrap','11 efek langsung, 5 mediasi tunggal, 3 mediasi berurutan'],['Keputusan','Pemetaan butir, skor kondisi, konsensus CBUI dan hasil jalur langsung','Prioritas indikator dan rencana aksi CSV']])+'<h3>Aturan keputusan prototipe</h3><p>Untuk tiap indikator, hitung rerata seluruh skor butir terkoreksi pada seluruh responden. Bobot pakar adalah (C + B + U + I) ÷ 20. Untuk konstruk dengan estimasi jalur langsung positif menuju Y dan batas bawah CI 95% di atas nol, skor prioritas = maksimum(0, ambang − rerata) × bobot pakar × koefisien jalur. Urutkan skor dari terbesar. Ambang awal 4, bobot kriteria setara, dan pemakaian efek langsung merupakan pilihan implementasi untuk dikonfirmasi oleh pakar. Mediasi dilaporkan terpisah.</p><p><b>Peran AI dalam POP-SDM-AI.</b> Proposal menempatkan AI pada eksplorasi variabel dan sintesis awal dengan telaah peneliti dan pakar. Mesin keputusan aplikasi ini menggunakan aturan yang dapat ditelusuri. Skor Y adalah skor kuesioner tingkat kelompok. Prediksi tanggal kelulusan individu memerlukan data longitudinal dan evaluasi tersendiri.</p><h3>Evaluasi untuk penelitian</h3><p>Bandingkan skor butir negatif dan rerata indikator dengan perhitungan manual. Cocokkan 19 jalur dengan keluaran SmartPLS, periksa keputusan saat interval mencakup nol, lalu minta pakar menilai kesesuaian urutan dan kelayakan aksi. Catat kesepakatan, selisih peringkat, serta perubahan keputusan saat ambang diubah.</p></section>'}
